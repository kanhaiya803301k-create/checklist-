<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Daily Checklist</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1>⚡ MY DAILY CHECKLIST</h1>
    <p>Build yourself. One day at a time.</p>
  </div>
  <div class="clock-box">
    <div id="liveDate">Loading...</div>
    <div id="liveTime">00:00:00</div>
  </div>
</header>

<section class="dashboard">
  <div class="stat"><span>📅 TODAY</span><strong id="todayText">--</strong></div>
  <div class="stat"><span>✅ TODAY'S PROGRESS</span><strong id="progressText">0%</strong></div>
  <div class="stat"><span>🔥 CURRENT STREAK</span><strong id="streakText">0 Days</strong></div>
</section>

<div class="progress-container">
  <div class="progress-bar"><div id="progressFill"></div></div>
</div>

<main class="table-wrapper">
  <table id="checklistTable">
    <thead><tr><th class="task-column">DAILY TASK</th></tr></thead>
    <tbody id="taskBody"></tbody>
  </table>
</main>

<footer>
  <p>💡 Consistency beats motivation.</p>
  <button onclick="goToToday()">📍 Go To Today</button>
</footer>
<script src="script.js"></script>
</body>
</html>
